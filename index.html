<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>block-world — voxel sandbox poc</title>
  <script type="module" src="./assets/index.js"></script>
  <link rel="stylesheet" href="./assets/index.css">
</head>

<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="hotbar" class="hidden">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>
  <!-- rows are generated in main.ts: one .slot row per PLACEABLE entry (icon + name) -->
  <div id="palette" class="hidden"></div>
  <div id="help" class="hidden">
    <div class="title">block-world — how to play</div>
    <div class="rows">
      <span class="key">click</span><span>lock mouse</span><span class="key">1–9 / wheel</span><span>select hotbar
        slot</span>
      <span class="key">WASD</span><span>move</span><span class="key">LMB</span><span>break block</span>
      <span class="key">SPACE</span><span>jump / swim</span><span class="key">RMB</span><span>place block</span>
      <span class="key">SHIFT</span><span>sink / fly-down</span><span class="key">E</span><span>block palette</span>
      <span class="key">F</span><span>toggle fly</span><span class="key">C</span><span>toggle wireframe</span>
      <span class="key">N</span><span>toggle noclip</span><span class="key">H</span><span>help (this overlay)</span>
      <span class="key">ESC</span><span>release mouse</span><span class="key">RMB</span><span>on a door: open /
        close</span>
    </div>
    <div class="foot">H or click to close</div>
  </div>
  <div id="help-hint" title="How to play (H)">
    <span class="q">?</span>
    <span class="key">h</span>
  </div>
</body>

</html>
